# Deploy to Fly.io on every push to main.
# Requires repo secret FLY_API_TOKEN (a Fly deploy token scoped to the app).
name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    # Serialize deploys; cancel a superseded in-flight deploy when a newer push lands.
    concurrency:
      group: fly-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
