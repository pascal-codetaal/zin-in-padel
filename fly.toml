# fly.toml app configuration file generated for zin-in-padel on 2026-05-28T13:47:48+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zin-in-padel'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'pnpm run start'
  worker = 'pnpm run worker:start'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
